services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/radarr/config:/config
      - /mnt/eagle1:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/sonarr/config:/config
      - /mnt/eagle1:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/sabnzbd/config:/config
      - /mnt/eagle1:/data
    ports:
      - 8081:8080
    restart: unless-stopped

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest
    container_name: nzbhydra2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/nzbhydra2/config:/config
      - /mnt/eagle1/downloads:/data/downloads
    ports:
      - 5076:5076
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - VERSION=docker
    volumes:
      - /opt/plex/config:/config
      - /mnt/eagle1/Plex/Movies:/data/movies
      - /mnt/eagle1/Plex/TV:/data/tv
      - /mnt/eagle1/Plex/Music:/data/music
      - /mnt/eagle1/Plex/Anime-Trial:/data/anime-trial
    restart: unless-stopped
